
<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anglerfish Scene</title>

    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
</head>

<body>
<a-scene background="color: #101525">

    <!-- De asset -->
    <a-assets>
        <a-asset-item
            id="anglerfish"
            src="assets/gobkit-animal-pack/Anglerfish.glb">
        </a-asset-item>
    </a-assets>

    <!-- Vloer -->
    <a-plane
        position="0 0 -4"
        rotation="-90 0 0"
        width="20"
        height="20"
        color="#252b3b">
    </a-plane>


<!-- Vis op ooghoogte -->
<a-entity
    position="0 0.5 -2"
    animation__rotate="
        property: rotation;
        to: 0 360 0;
        dur: 10000;
        easing: linear;
        loop: true"
    animation__float="
        property: position;
        to: 0 0.8 -2;
        dir: alternate;
        dur: 2500;
        easing: easeInOutSine;
        loop: true">

    <a-entity
        gltf-model="#anglerfish"
        position="0 0 0"
        scale="0.4 0.4 0.4">
    </a-entity>

</a-entity>

<!-- Camera kijkt horizontaal naar voren -->
<a-entity
    camera
    position="0 40 200"
    rotation="0 0 0"
    look-controls>
</a-entity>


    <!-- Point-light: rondom de vis -->
    <a-entity
        position="-1 2.5 -2"
        light="
            type: point;
            color: #70c8ff;
            intensity: 2.5;
            distance: 10;
            decay: 2">
    </a-entity>

    <!-- Spotlight: gericht op de vis -->
    <a-entity
        position="1 3 -1"
        rotation="-35 25 0"
        light="
            type: spot;
            color: #fff0c2;
            intensity: 4;
            angle: 45;
            penumbra: 0.5;
            distance: 10;
            decay: 2">
    </a-entity>

    <!-- Omgevingslicht -->
    <a-entity
        light="type: ambient; color: #ffffff; intensity: 0.5">
    </a-entity>


</a-scene>
</body>
</html>
